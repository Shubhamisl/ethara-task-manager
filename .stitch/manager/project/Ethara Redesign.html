<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Ethara — Premium Redesign</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;450;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script src="data.js"></script>
<script type="text/babel" src="icons.jsx"></script>
<script type="text/babel" src="shell.jsx"></script>
<script type="text/babel" src="page-dashboard.jsx"></script>
<script type="text/babel" src="page-projects.jsx"></script>
<script type="text/babel" src="page-project-detail.jsx"></script>
<script type="text/babel" src="page-auth-and-dialogs.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>

<script type="text/babel" data-presets="react">
const { useState, useEffect } = React;

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "accent": "#3F52C9",
  "density": "cozy",
  "fontPair": "tight",
  "cardStyle": "bordered",
  "showActivity": true
}/*EDITMODE-END*/;

const ACCENT_PRESETS = {
  "#3F52C9": { name: "Indigo", a12: "#1E2A78", a11: "#2A3C9E", a9: "#3F52C9", a4: "#D6DBF3", a3: "#E5E9F8", a2: "#EEF1FB", a1: "#F4F6FC" },
  "#0B0D0F": { name: "Mono",   a12: "#000000", a11: "#0B0D0F", a9: "#1A1D21", a4: "#CDD2D9", a3: "#E2E5EA", a2: "#EEF0F3", a1: "#F5F6F8" },
  "#1F6E7A": { name: "Teal",   a12: "#0F4750", a11: "#175663", a9: "#1F6E7A", a4: "#C9E2E7", a3: "#DCEDF0", a2: "#EAF4F6", a1: "#F1F8F9" },
  "#5E3AAE": { name: "Violet", a12: "#3D1F84", a11: "#4B2A95", a9: "#5E3AAE", a4: "#DBCDF5", a3: "#E7DEF8", a2: "#EFE9FB", a1: "#F5F1FC" },
  "#B85E1B": { name: "Ember",  a12: "#7A3A0D", a11: "#964613", a9: "#B85E1B", a4: "#F1D3B8", a3: "#F6E1CB", a2: "#FAEDDC", a1: "#FCF5EB" },
};

function App() {
  const [tweaks, setTweak] = window.useTweaks(TWEAK_DEFAULTS);
  const [route, setRoute] = useState({ name: "dashboard" });
  const [tab, setTab] = useState("tasks");
  const [showNewTask, setShowNewTask] = useState(false);
  const [showNewProject, setShowNewProject] = useState(false);

  useEffect(() => {
    const preset = ACCENT_PRESETS[tweaks.accent] || ACCENT_PRESETS["#3F52C9"];
    const root = document.documentElement;
    root.style.setProperty("--accent-12", preset.a12);
    root.style.setProperty("--accent-11", preset.a11);
    root.style.setProperty("--accent-9", preset.a9);
    root.style.setProperty("--accent-4", preset.a4);
    root.style.setProperty("--accent-3", preset.a3);
    root.style.setProperty("--accent-2", preset.a2);
    root.style.setProperty("--accent-1", preset.a1);

    if (tweaks.density === "compact") {
      root.style.setProperty("--topbar-h", "44px");
      document.body.style.fontSize = "13px";
    } else {
      root.style.setProperty("--topbar-h", "52px");
      document.body.style.fontSize = "14px";
    }

    const fonts = {
      tight:  '"Inter Tight", "Inter", system-ui, sans-serif',
      inter:  '"Inter", system-ui, sans-serif',
      serif:  '"Source Serif 4", "Source Serif Pro", Georgia, serif',
    };
    root.style.setProperty("--font-display", fonts[tweaks.fontPair] || fonts.tight);
  }, [tweaks]);

  function navigate(name, projectId) {
    if (name === "project") setRoute({ name: "project", projectId });
    else setRoute({ name });
    setTab("tasks");
  }

  // Auth screens — full bleed
  if (route.name === "login") return <window.LoginPage onLogin={() => setRoute({ name: "dashboard" })} onSwitch={() => setRoute({ name: "signup" })} />;
  if (route.name === "signup") return <window.SignupPage onSignup={() => setRoute({ name: "dashboard" })} onSwitch={() => setRoute({ name: "login" })} />;

  return (
    <>
      <div className="app">
        <window.Sidebar
          active={route.name}
          activeProjectId={route.projectId}
          onNavigate={navigate}
        />
        <div className="main">
          {route.name === "dashboard" && <window.DashboardPage onNavigate={navigate} />}
          {route.name === "projects" && <window.ProjectsPage onNavigate={navigate} onNew={() => setShowNewProject(true)} />}
          {route.name === "project" && (
            <window.ProjectDetailPage
              projectId={route.projectId}
              tab={tab}
              onTabChange={setTab}
              onNewTask={() => setShowNewTask(true)}
              onNavigate={navigate}
            />
          )}
        </div>
      </div>

      {showNewTask && <window.NewTaskDialog onClose={() => setShowNewTask(false)} />}
      {showNewProject && <window.NewProjectDialog onClose={() => setShowNewProject(false)} />}

      <window.TweaksPanel title="Tweaks">
        <window.TweakSection title="Theme">
          <div style={{ marginBottom: 8, fontSize: 11.5, color: "var(--tw-muted, #888)" }}>Accent</div>
          <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
            {Object.entries(ACCENT_PRESETS).map(([hex, p]) => (
              <button key={hex} onClick={() => setTweak("accent", hex)} title={p.name} style={{
                width: 28, height: 28, borderRadius: 6, background: hex,
                border: tweaks.accent === hex ? "2px solid #fff" : "2px solid transparent",
                outline: tweaks.accent === hex ? "2px solid #111" : "none",
                cursor: "pointer", padding: 0,
              }} />
            ))}
          </div>
        </window.TweakSection>
        <window.TweakSection title="Layout">
          <window.TweakRadio label="Density" value={tweaks.density} onChange={(v) => setTweak("density", v)}
            options={[{ label: "Compact", value: "compact" }, { label: "Cozy", value: "cozy" }]} />
          <window.TweakRadio label="Heading font" value={tweaks.fontPair} onChange={(v) => setTweak("fontPair", v)}
            options={[{ label: "Tight", value: "tight" }, { label: "Inter", value: "inter" }, { label: "Serif", value: "serif" }]} />
        </window.TweakSection>
        <window.TweakSection title="Navigate">
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 6 }}>
            <button className="btn btn-secondary btn-sm" onClick={() => setRoute({ name: "login" })}>Login</button>
            <button className="btn btn-secondary btn-sm" onClick={() => setRoute({ name: "signup" })}>Signup</button>
            <button className="btn btn-secondary btn-sm" onClick={() => navigate("dashboard")}>Dashboard</button>
            <button className="btn btn-secondary btn-sm" onClick={() => navigate("projects")}>Projects</button>
            <button className="btn btn-secondary btn-sm" onClick={() => navigate("project", "p1")}>Project</button>
            <button className="btn btn-secondary btn-sm" onClick={() => setShowNewTask(true)}>New task</button>
          </div>
        </window.TweakSection>
      </window.TweaksPanel>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>

</body>
</html>
